{% extends "base.html" %}

{% block title %}Track a shipment{% endblock %}

{% block content %}
<section class="container narrow">
  <div class="card auth-card">
    <h1>Track your shipment</h1>
    <p class="muted">Enter the tracking ID you received when you made your request.</p>
    <form method="get" action="{% url 'shipments:track_lookup' %}">
      <div class="field">
        <label for="tracking_id">Tracking ID</label>
        <input class="input" id="tracking_id" type="text" name="tracking_id" value="{{ query }}" placeholder="SSL-ABCD123456" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Track</button>
    </form>
  </div>
</section>
{% endblock %}
